<!DOCTYPE html>
<html lang="en">
  {{ partial "head.html" . }}

  {{- $bodyClass := "section-background" -}}
  {{- if .Page.IsHome -}}
  {{- $bodyClass = "main-background" -}}
  {{- end -}}

  <body class="{{ $bodyClass }}">
    {{ partial "header.html" . }}
    <main>
    {{- block "main" . }}{{ end -}}
    </main>
    {{ partial "footer.html" . -}}
    <script src="/cfm/4.10.0/nifi-components-cfm/uikit/js/uikit.min.js"></script>
    <script src="/cfm/4.10.0/nifi-components-cfm/uikit/js/uikit-icons.min.js"></script>
  </body>
</html>
